name: ci

on:
  push:
    branches: [master]
  pull_request:
  # release.yml and docker.yml call this workflow, so a tag cannot publish
  # anything these checks would have caught.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The same command a developer runs: vet, the suite, and a gofmt check.
      - run: make check
