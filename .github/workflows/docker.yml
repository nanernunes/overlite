name: docker

on:
  push:
    tags: ["v*"]

# Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, not
# the account password) in the repository secrets.
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: nanernunes/overlite
          # v1.2.3 publishes 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          # No QEMU: the Dockerfile builds on the native platform and
          # cross-compiles, so arm64 costs a compile, not an emulated one.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub has no idea what is in the repo, so the Overview tab stays
      # empty unless something pushes the README into it. Needs the token to
      # carry read/write/delete — pushing an image only needs read/write.
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: nanernunes/overlite
          # No short-description on purpose: the tagline is set in the Docker
          # Hub UI, and passing one here would overwrite it on every release.
          enable-url-completion: true
