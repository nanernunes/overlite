name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One job builds every platform and uploads once. Go cross-compiles without a
# toolchain per target, so a build matrix would only add jobs racing to create
# the same release.
jobs:
  # A tag that fails the checks publishes nothing.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every platform
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            export GOOS GOARCH
            make build

            # A bare binary rather than an archive: one file to download and
            # run, with no unpack step. The name carries no version — the tag
            # already says which release this is, and a fixed asset name is
            # what GitHub's releases/latest/download/ URL can resolve.
            name=overlite-$GOOS-$GOARCH
            built=bin/overlite
            if [ "$GOOS" = windows ]; then
              name="$name.exe"
              built=bin/overlite.exe
            fi
            mv "$built" "dist/$name"
            ( cd dist && sha256sum "$name" > "$name.sha256" )
          done
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
